[project]
name = "rangewise"
version = "0.1.0"
description = "Agent skill that decides npm, Cargo, PyPI, Composer and Maven version ranges the way each ecosystem does."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LeeGyeongPil" }]
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov>=6.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
